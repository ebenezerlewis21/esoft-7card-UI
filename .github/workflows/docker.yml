name: Docker Image

# - Pull requests: build the image only (validation, no push)
# - Push to `dev`:  build + publish the image for the DEV environment
# - Push to `main`: build + publish the image for the PROD environment
on:
  pull_request:
  push:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/ebenezerlewis21/esoft-7card-ui

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On PRs we only build to validate the Dockerfile; on pushes to
      # dev/main we also publish.
      - name: Determine target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=pr" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.target.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # e.g. on dev -> :dev, :dev-<sha>;  on main -> :prod, :prod-<sha>, :latest
          tags: |
            type=raw,value=${{ steps.target.outputs.env_name }}
            type=raw,value=${{ steps.target.outputs.env_name }}-{{sha}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.target.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
